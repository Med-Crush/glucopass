<style>
  html,body{margin:0;height:100%;}
  body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#16302c;-webkit-font-smoothing:antialiased;
    background:#e6ece8;background-image:radial-gradient(circle at 15% 20%,#d3efe6 0,transparent 40%),radial-gradient(circle at 85% 80%,#fbecd0 0,transparent 40%);}
  *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
  button{transition:transform .12s ease, background-color .2s, opacity .2s;cursor:pointer}
  button:active:not(:disabled){transform:scale(.97)}
  button:disabled{cursor:not-allowed}
  input,textarea{font-family:inherit}
  .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
  .safe-b{padding-bottom:max(env(safe-area-inset-bottom),0px)}
  .tnum{font-variant-numeric:tabular-nums}

  @keyframes pushIn{from{transform:translateX(28%);opacity:0}to{transform:none;opacity:1}}
  @keyframes popIn{from{transform:translateX(-12%);opacity:0}to{transform:none;opacity:1}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .anim-push{animation:pushIn .34s cubic-bezier(.2,.8,.2,1)}
  .anim-pop{animation:popIn .3s cubic-bezier(.2,.8,.2,1)}
  .anim-fade{animation:fadeIn .28s ease-out}
  .stagger>*{animation:fadeIn .45s ease-out both}
  .stagger>*:nth-child(2){animation-delay:.04s}.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.12s}
  .stagger>*:nth-child(5){animation-delay:.16s}.stagger>*:nth-child(6){animation-delay:.2s}.stagger>*:nth-child(7){animation-delay:.24s}.stagger>*:nth-child(n+8){animation-delay:.28s}

  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  .skel{background:linear-gradient(90deg,#eceee9 25%,#f6f7f3 50%,#eceee9 75%);background-size:200% 100%;animation:shimmer 1.3s infinite linear;border-radius:12px}

  @keyframes scanY{0%{top:0%}50%{top:calc(100% - 4px)}100%{top:0%}}
  .scanline{position:absolute;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,#36bfa5,transparent);box-shadow:0 0 18px 6px rgba(54,191,165,.55);animation:scanY 2.2s ease-in-out infinite}
  .scangrid{background-image:linear-gradient(rgba(54,191,165,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(54,191,165,.18) 1px,transparent 1px);background-size:22px 22px}
  @keyframes boxIn{0%{opacity:0;transform:scale(1.25)}60%{opacity:1;transform:scale(.97)}100%{opacity:1;transform:scale(1)}}
  .ocrbox{animation:boxIn .45s ease-out both}

  @keyframes toastIn{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
  .toast{animation:toastIn .35s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes popBurst{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.12);opacity:1}75%{transform:scale(.96)}100%{transform:scale(1);opacity:1}}
  .pop{animation:popBurst .55s cubic-bezier(.2,.9,.3,1.3) both}
  @keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
  @keyframes confetti{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
  .confetti{position:absolute;width:8px;height:12px;border-radius:2px;animation:confetti 1.2s cubic-bezier(.15,.7,.3,1) forwards}
  @keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
  .tdot{animation:dot 1.2s infinite}
  @keyframes ping2{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.2);opacity:0}}
  .ping2{animation:ping2 1.6s ease-out infinite}
  @keyframes logoIn{0%{transform:scale(.6) rotate(-12deg);opacity:0}60%{transform:scale(1.08) rotate(3deg);opacity:1}100%{transform:none;opacity:1}}
  .logo-in{animation:logoIn .8s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  .wiggle{animation:wiggle 1.8s ease-in-out infinite}
  @keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .bar-grow{transform-origin:bottom;animation:barGrow .6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes dash{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
  .draw{animation:dash 1s ease-out both}
  .ring-anim{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
  .passport-bg{background:linear-gradient(135deg,#0b8a76 0%,#0c6f61 55%,#104a43 100%)}
  .passport-pattern{background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:10px 10px}
  .paper-lines{background-image:repeating-linear-gradient(0deg,transparent,transparent 23px,rgba(0,0,0,.03) 24px)}
</style>

function nutri(items) {
  const t = {
    kcal: 0,
    carbs: 0,
    sugar: 0,
    fiber: 0,
    protein: 0,
    fat: 0,
    gl: 0
  };
  items.forEach(({
    id,
    p
  }) => {
    const f = FOOD[id];
    if (!f) return;
    ['kcal', 'carbs', 'sugar', 'fiber', 'protein', 'fat'].forEach(k => t[k] += f[k] * p);
    t.gl += f.gi * Math.max(0, f.carbs - f.fiber) * p / 100;
  });
  Object.keys(t).forEach(k => t[k] = Math.round(t[k] * 10) / 10);
  return t;
}
const glLevel = gl => gl <= 20 ? 'good' : gl <= 35 ? 'warn' : 'risk';
const mealStatus = n => n.gl > 35 || n.sugar > 20 ? 'risk' : n.gl > 20 || n.sugar > 10 ? 'warn' : 'good';
const mealTitle = items => {
  const names = items.map(i => L(FOOD[i.id]?.n)).filter(Boolean);
  if (names.length <= 2) return names.join(' + ');
  return names.slice(0, 2).join(', ') + ' +' + (names.length - 2);
};

// Assistant warnings for a meal; returns [{level, icon, text}]
function mealWarnings(items, n, target) {
  const w = [];
  items.forEach(({
    id,
    p
  }) => {
    const f = FOOD[id];
    if (f.sugar * p >= 14) w.push({
      level: 'risk',
      icon: 'droplet',
      text: fill(T('High in added sugar — {name} has ±{g} g of sugar.', 'Tinggi gula tambahan — {name} mengandungi ±{g} g gula.'), {
        name: L(f.n),
        g: Math.round(f.sugar * p)
      })
    });
  });
  items.forEach(({
    id
  }) => {
    const f = FOOD[id];
    if (f.gi >= 66 && f.carbs >= 24 && f.swap) w.push({
      level: 'warn',
      icon: 'zap',
      text: fill(T('{name} has a high glycaemic index — try {alt} next time.', '{name} mempunyai indeks glisemik tinggi — cuba {alt} lain kali.'), {
        name: L(f.n),
        alt: L(FOOD[f.swap].n).toLowerCase()
      })
    });
  });
  if (target && n.carbs > target * 0.4) w.push({
    level: 'warn',
    icon: 'target',
    text: fill(T('This meal uses {p}% of your daily carb target.', 'Hidangan ini menggunakan {p}% sasaran karbohidrat harian anda.'), {
      p: Math.round(n.carbs / target * 100)
    })
  });
  if (n.fiber < 3 && n.carbs > 20) w.push({
    level: 'warn',
    icon: 'leaf',
    text: T('Low in fibre — add vegetables or ulam to slow sugar absorption.', 'Rendah serat — tambah sayur atau ulam untuk melambatkan penyerapan gula.')
  });
  if (!w.length) w.push({
    level: 'good',
    icon: 'check',
    text: T('Nicely balanced meal! Keep it up 👏', 'Hidangan yang seimbang! Teruskan 👏')
  });
  return w;
}

function computeStreak(meals) {

  let s = 0;
  let d = startOfDay(now());
  if (!days.has(d)) d -= DAY;
  while (days.has(d)) {
    s++;
    d -= DAY;
  }
  return s;
}

    l: T('Not done yet', 'Belum dibuat'),
    next: now()
  };
  const next = last.t + FREQ[freq].d * DAY;
  const diff = Math.round((next - now()) / DAY);
  if (diff < 0) return {
    s: 'risk',
    next,
    l: fill(T('Overdue {n} days', 'Lewat {n} hari'), {
      n: -diff
    })
  };
  if (diff <= 30) return {
    s: 'warn',
    next,
    l: fill(T('Due in {n} days', 'Perlu dalam {n} hari'), {
      n: diff
    })
  };
  return {
    s: 'good',
    next,
    l: T('Next', 'Seterusnya') + ': ' + fmtDate(next, {
      month: 'short',
      year: 'numeric'
    })
  };
}
